[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zshar"
version = "0.1.0"
description = "Dataset-independent zero-shot human activity recognition pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "joblib>=1.2",
  "requests>=2.28",
]

[project.optional-dependencies]
autogluon = ["autogluon.tabular"]
boosting = ["catboost", "lightgbm", "xgboost"]
neural = ["torch"]
calibration = ["optuna>=3"]
dev = ["pytest>=7"]

[project.scripts]
zshar = "zshar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
